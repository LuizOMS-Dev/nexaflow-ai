# NexaFlow AI — stack completa (Docker Desktop)
# Uso: docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexaflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexaflow
      POSTGRES_PASSWORD: nexaflow
      POSTGRES_DB: nexaflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexaflow -d nexaflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: nexaflow-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Gateway WhatsApp central (Evolution) — clientes só escaneiam QR no painel
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: nexaflow-evolution
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-nexaflow-evolution-key}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://nexaflow:nexaflow@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: nexaflow_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      LOG_LEVEL: ERROR,WARN,INFO
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_CLIENT: NexaFlow
      CONFIG_SESSION_PHONE_NAME: Chrome
    volumes:
      - evolution_data:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 0"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexaflow-api
    restart: unless-stopped
    environment:
      # development = stack local Docker (fail-closed de prod não bloqueia localhost)
      # Em VPS real: NODE_ENV=production + secrets fortes via .env
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://nexaflow:nexaflow@postgres:5432/nexaflow?schema=public
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: 4000
      API_URL: ${API_URL:-http://localhost:4000}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      # Webhooks da Evolution → API (rede Docker interna)
      INTERNAL_API_URL: http://api:4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-nexaflow-local-docker-jwt-secret-min-32-chars!!}
      COOKIE_SECRET: ${COOKIE_SECRET:-nexaflow-local-docker-cookie-secret-32!!}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-nexaflow-local-docker-enc-key-32chars!!}
      # Access JWT real = 15m (session layer); não use 7d aqui
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      # Gateway central: API fala com Evolution na rede Docker
      WA_GATEWAY_PROVIDER: evolution
      WA_GATEWAY_URL: http://evolution:8080
      WA_GATEWAY_API_KEY: ${EVOLUTION_API_KEY:-nexaflow-evolution-key}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-nexaflow-evolution-key}
      # E-mail (dev = log no console da API)
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      MAIL_API_KEY: ${MAIL_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-NexaFlow <onboarding@resend.dev>}
      CAMPAIGN_BATCH_LIMIT: ${CAMPAIGN_BATCH_LIMIT:-100}
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-}
      SEED_SUPERADMIN_NAME: ${SEED_SUPERADMIN_NAME:-Super Admin}
      SEED_COMPANY_NAME: ${SEED_COMPANY_NAME:-Minha Empresa}
      SEED_TENANT_SLUG: ${SEED_TENANT_SLUG:-minha-empresa}
      # 0 = plataforma limpa (só superadmin, sem empresa demo no boot)
      SEED_CREATE_TENANT: ${SEED_CREATE_TENANT:-0}
      # 1 = esvazia contatos/conversas/canais no boot (apenas reset manual)
      SEED_WIPE_ALL: ${SEED_WIPE_ALL:-0}
      # 0 = em testes locais libera /admin sem MFA (produção: deixe 1 ou omita)
      SUPERADMIN_MFA_REQUIRED: ${SUPERADMIN_MFA_REQUIRED:-0}
      # Volumes persistentes (obrigatório em produção)
      STORAGE_LOCAL_PATH: /app/uploads
      WA_SESSIONS_DIR: /app/data/wa-sessions
      # EasyPanel/reverse proxy: em produção use TRUST_PROXY=true ou CIDR do proxy
      TRUST_PROXY: ${TRUST_PROXY:-true}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - uploads_data:/app/uploads
      - wa_sessions:/app/data/wa-sessions
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # same-origin proxy — browser nunca fala direto com :4000 (elimina Failed to fetch/CORS)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/nexa-api}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-NexaFlow}
        # WS direto na API publicada (browser → host:4000)
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/ws}
    container_name: nexaflow-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/nexa-api}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-NexaFlow}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/ws}
      # destino do proxy no container web (rede Docker)
      API_PROXY_TARGET: http://api:4000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  evolution_data:
  wa_sessions:
