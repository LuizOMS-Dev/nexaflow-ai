# NexaFlow AI — stack local
# Uso: npm run docker:up   ou   docker compose --env-file .env.docker up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexaflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexaflow
      POSTGRES_PASSWORD: nexaflow
      POSTGRES_DB: nexaflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexaflow -d nexaflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: nexaflow-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexaflow-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://nexaflow:nexaflow@postgres:5432/nexaflow?schema=public
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: 4000
      API_URL: ${API_URL:-http://localhost:4000}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-nexaflow-local-docker-jwt-secret-min-32-chars!!}
      COOKIE_SECRET: ${COOKIE_SECRET:-nexaflow-local-docker-cookie-secret-32!!}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-nexaflow-local-docker-enc-key-32chars!!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WA_GATEWAY_PROVIDER: ${WA_GATEWAY_PROVIDER:-baileys}
      WA_GATEWAY_URL: ${WA_GATEWAY_URL:-}
      WA_GATEWAY_API_KEY: ${WA_GATEWAY_API_KEY:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-}
      SEED_SUPERADMIN_NAME: ${SEED_SUPERADMIN_NAME:-Super Admin}
      SUPERADMIN_MFA_REQUIRED: ${SUPERADMIN_MFA_REQUIRED:-0}
      STORAGE_LOCAL_PATH: /app/uploads
      WA_SESSIONS_DIR: /app/data/wa-sessions
      TRUST_PROXY: ${TRUST_PROXY:-true}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - uploads_data:/app/uploads
      - wa_sessions:/app/data/wa-sessions
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/nexa-api}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-NexaFlow}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/ws}
    container_name: nexaflow-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/nexa-api}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-NexaFlow}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/ws}
      API_PROXY_TARGET: http://api:4000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  wa_sessions:
